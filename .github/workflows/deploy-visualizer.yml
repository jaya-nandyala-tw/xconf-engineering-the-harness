name: Deploy visualizer to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "visualizer/**"
      - ".github/workflows/deploy-visualizer.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: visualizer/package-lock.json

      - name: Install dependencies
        working-directory: visualizer
        run: npm ci

      - name: Build
        working-directory: visualizer
        run: npm run build

      - name: Add SPA fallback for client-side routing
        working-directory: visualizer
        run: cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: visualizer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
